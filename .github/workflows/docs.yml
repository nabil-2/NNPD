name: Documentation

# Publishing is manual: only a "Run workflow" dispatch can deploy to Pages.
# Pushes and pull requests build the documentation as a check and never deploy.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish the built documentation to GitHub Pages"
        type: boolean
        default: true
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One group per trigger: a newer push or pull-request check replaces an older one,
# but a push never cancels a manual publish, and a publish never cancels a check.
concurrency:
  group: docs-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0  # setup-uv publishes no floating major tag
        with:
          python-version: "3.13"
      - name: Install documentation dependencies only
        run: uv sync --locked --only-group docs
      # --no-sync keeps `uv run` from installing NNPD and PyTorch.
      - name: Check documentation sources
        run: uv run --no-sync python docs/check.py
      - name: Build HTML (warnings are errors)
        run: uv run --no-sync python -m sphinx -b html -W --keep-going -E -a docs docs/_build/html
      - name: Check generated internal links and assets
        run: uv run --no-sync python docs/check.py --html docs/_build/html
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/_build/html

  deploy:
    name: Publish on GitHub Pages
    # Only a manual dispatch that asked to deploy reaches this job.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
